name: Deploy Frontend Dockerized

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "."
          target: "/www/wwwroot/medipos-client"

      - name: Build and Deploy via Docker Compose SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /www/wwwroot/medipos-client

            echo "Rebuilding and restarting frontend container..."
            docker compose up --build -d --remove-orphans
            
            # Clean up old unused images
            docker image prune -f

            echo "Frontend deployment completed successfully!"